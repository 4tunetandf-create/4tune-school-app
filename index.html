<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>4TUNE School App</title>

    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <link rel="stylesheet" href="./css/styles.css" />
  </head>

  <body>
    <main id="status">読み込み中...</main>

    <div
      id="loadingOverlay"
      class="loading-overlay"
      role="status"
      aria-live="polite"
      aria-hidden="true"
    >
      <div class="loading-panel">
        <img
          class="loading-logo"
          src="./assets/images/team-logo.png"
          alt="4-tune 京都の本気で楽しむ・速くなる陸上スクール"
        >
        <div class="loading-progress" aria-hidden="true"></div>
        <p id="loadingMessage" class="loading-message">読み込み中...</p>
      </div>
    </div>

    <div id="scheduleModal" onclick="closeScheduleModal(event)">
      <div id="scheduleModalContent"></div>
    </div>

    <script src="./js/app.js"></script>
  </body>
</html>
