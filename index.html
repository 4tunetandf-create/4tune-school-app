<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>4TUNE School App</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      background: #f5f7f6;
      color: #222;
    }

    main {
      max-width: 560px;
      margin: 0 auto;
      padding: 20px;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }

    input,
    button {
      box-sizing: border-box;
      font: inherit;
    }

    input {
      width: 100%;
      padding: 11px;
      margin: 5px 0 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    button {
      padding: 10px 14px;
      margin: 4px 2px;
      border: 0;
      border-radius: 8px;
      background: #4f9c8a;
      color: #fff;
      cursor: pointer;
    }

    button.secondary {
      background: #777;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      background: #fff;
    }

    th,
    td {
      border: 1px solid #ddd;
      padding: 7px 2px;
      text-align: center;
    }

    td {
      height: 54px;
      vertical-align: top;
    }

    td.has-schedule {
      cursor: pointer;
      background: #edf7f4;
    }

    .calendar-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .muted {
      color: #666;
    }

    #scheduleModal {
      display: none;
      position: fixed;
      inset: 0;
      padding: 20px;
      background: rgba(0, 0, 0, 0.5);
      z-index: 10;
    }

    #scheduleModalContent {
      max-width: 420px;
      margin: 80px auto;
      background: #fff;
      border-radius: 12px;
      padding: 20px;
    }
  </style>
</head>

<body>

  <main id="status">
    読み込み中...
  </main>

  <div
    id="scheduleModal"
    onclick="closeScheduleModal(event)"
  >
    <div id="scheduleModalContent"></div>
  </div>

<script>
const GAS_URL =
  "https://script.google.com/macros/s/AKfycbzjPkLxYBJeBGk9yehLHfUUMhJmQUfxNiaVHyNqjd9MeAqkWOIINjIUBXsxIEpwqa78Mw/exec";

const LIFF_ID = "2010350476-xCTsckal";

const CACHE = {
  profile: null,
  members: null,
  schedules: null,

  // 動作分析ファイル一覧
  analysisMembers: null,
  analysisError: null
};

let currentCalendarDate = new Date();
let uiLockCount = 0;


// =======================
// 初期処理
// =======================
async function main() {

  lockUI("読み込み中...");

  try {

    await liff.init({
      liffId: LIFF_ID
    });

    if (!liff.isLoggedIn()) {
      liff.login();
      return;
    }

    CACHE.profile = await liff.getProfile();

    const parent = await apiGet(
      "getParentByLineId",
      {
        lineUserId: CACHE.profile.userId
      }
    );

    if (!parent.exists) {
      showRegister(CACHE.profile.userId);
      return;
    }

    await loadHome();

  } catch (error) {

    showError(error);

  } finally {

    unlockUI();

  }
}


// =======================
// API通信
// =======================
async function apiGet(action, params = {}) {

  const query = new URLSearchParams({
    action,
    ...params
  });

  const response = await fetch(
    `${GAS_URL}?${query.toString()}`
  );

  if (!response.ok) {
    throw new Error("データの取得に失敗しました");
  }

  return response.json();
}


async function apiPost(data) {

  const response = await fetch(
    GAS_URL,
    {
      method: "POST",
      body: JSON.stringify(data)
    }
  );

  if (!response.ok) {
    throw new Error("データの登録に失敗しました");
  }

  return response.json();
}


// =======================
// UIロック
// =======================
function lockUI(text = "処理中...") {

  uiLockCount++;

  document.body.style.pointerEvents = "none";
  document.body.style.opacity = "0.65";

  const status =
    document.getElementById("status");

  if (status && text) {
    status.textContent = text;
  }
}


function unlockUI() {

  uiLockCount =
    Math.max(0, uiLockCount - 1);

  if (uiLockCount === 0) {

    document.body.style.pointerEvents = "auto";
    document.body.style.opacity = "1";

  }
}


// =======================
// HTMLエスケープ
// =======================
function escapeHtml(value) {

  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}


// =======================
// エラー画面
// =======================
function showError(error) {

  console.error(error);

  document.getElementById("status").innerHTML = `
    <section class="card">

      <h2>読み込みに失敗しました</h2>

      <p class="muted">
        通信環境を確認して、もう一度お試しください
      </p>

      <button onclick="location.reload()">
        再読み込み
      </button>

    </section>
  `;

}


// =======================
// 初回登録画面
// =======================
function showRegister(lineUserId) {

  document.getElementById("status").innerHTML = `
    <section class="card">

      <h2>初回登録</h2>

      <label>
        保護者名

        <input
          id="parentName"
          placeholder="例：山田太郎"
        >
      </label>

      <h3>お子さま</h3>

      <div id="childrenArea">

        <div class="childRow">

          <input
            class="childName"
            placeholder="子ども名"
          >

          <input
            class="childCourse"
            placeholder="クラスID・コース"
          >

        </div>

      </div>

      <button
        class="secondary"
        onclick="addChildRow()"
      >
        ＋ お子さまを追加
      </button>

      <button
        onclick="registerAll('${lineUserId}')"
      >
        登録する
      </button>

    </section>
  `;

}


// =======================
// 子どもの入力欄を追加
// =======================
function addChildRow() {

  const row =
    document.createElement("div");

  row.className = "childRow";

  row.innerHTML = `
    <input
      class="childName"
      placeholder="子ども名"
    >

    <input
      class="childCourse"
      placeholder="クラスID・コース"
    >
  `;

  document
    .getElementById("childrenArea")
    .appendChild(row);

}


// =======================
// 保護者・子どもの登録
// =======================
async function registerAll(lineUserId) {

  const parentName =
    document
      .getElementById("parentName")
      .value
      .trim();

  const names = [
    ...document.querySelectorAll(".childName")
  ];

  const courses = [
    ...document.querySelectorAll(".childCourse")
  ];

  const children =
    names
      .map((input, index) => ({
        name: input.value.trim(),
        course: courses[index].value.trim()
      }))
      .filter(child => child.name);

  if (!parentName) {
    alert("保護者名を入力してください");
    return;
  }

  if (children.length === 0) {
    alert("お子さまの名前を入力してください");
    return;
  }

  lockUI("登録中...");

  try {

    const parent = await apiPost({
      action: "createParent",
      lineUserId,
      name: parentName
    });

    if (!parent.success) {

      throw new Error(
        parent.message ||
        "保護者登録に失敗しました"
      );

    }

    for (const child of children) {

      const result = await apiPost({
        action: "addMember",
        parentId: parent.parentId,
        ...child
      });

      if (!result.success) {

        throw new Error(
          result.message ||
          "会員登録に失敗しました"
        );

      }

    }

    alert("登録が完了しました");

    location.reload();

  } catch (error) {

    alert(error.message);

  } finally {

    unlockUI();

  }

}


// =======================
// ホーム画面の読み込み
// =======================
async function loadHome() {

  lockUI(
    "会員情報を取得中..."
  );

  try {

    // =====================
    // 会員情報取得
    // =====================
    if (!CACHE.members) {

      const memberData =
        await apiGet(
          "getMembersByLineId",
          {
            lineUserId:
              CACHE.profile.userId
          }
        );

      CACHE.members =
        memberData.members || [];

    }

    // =====================
    // 分析ファイル一覧取得
    // =====================
    if (!CACHE.analysisMembers) {

      try {

        const analysisData =
          await apiGet(
            "getAnalysisFileList",
            {
              lineUserId:
                CACHE.profile.userId
            }
          );

        if (
          analysisData.success
        ) {

          CACHE.analysisMembers =
            analysisData.members || [];

          CACHE.analysisError =
            null;

        } else {

          CACHE.analysisMembers = [];

          CACHE.analysisError =
            analysisData.message ||
            "分析結果を取得できませんでした";

        }

      } catch (error) {

        console.error(
          "分析結果一覧の取得エラー",
          error
        );

        /*
         * 分析結果の取得に失敗しても、
         * ホーム画面とカレンダーは表示する
         */
        CACHE.analysisMembers = [];

        CACHE.analysisError =
          "分析結果を取得できませんでした";

      }

    }

    renderHome();

  } finally {

    unlockUI();

  }

}


// =======================
// ホーム画面
// =======================
function renderHome() {

  const membersHtml =
    CACHE.members.length
      ? CACHE.members
          .map(
            member => `
              <li>
                ${escapeHtml(
                  member.name
                )}
              </li>
            `
          )
          .join("")
      : `
          <li>
            登録会員はいません
          </li>
        `;

  const analysisHtml =
    createAnalysisListHtml();

  document
    .getElementById("status")
    .innerHTML = `

      <section class="card">

        <h2>
          こんにちは
          ${escapeHtml(
            CACHE.profile.displayName
          )}
          さま
        </h2>

        <h3>登録会員</h3>

        <ul>
          ${membersHtml}
        </ul>

      </section>

      <section class="card">

        <h3>動作分析結果</h3>

        ${analysisHtml}

      </section>

      <section class="card">

        <h3>
          スクールスケジュール
        </h3>

        <button
          onclick="showSchedule()"
        >
          カレンダーを見る
        </button>

      </section>
    `;

}


// =======================
// 動作分析結果一覧の作成
// =======================
function createAnalysisListHtml() {

  if (CACHE.analysisError) {

    return `
      <p class="muted">
        ${escapeHtml(
          CACHE.analysisError
        )}
      </p>

      <button
        onclick="reloadAnalysisList()"
      >
        再読み込み
      </button>
    `;

  }

  if (
    !CACHE.analysisMembers ||
    CACHE.analysisMembers.length === 0
  ) {

    return `
      <p class="muted">
        現在、表示できる分析結果はありません
      </p>
    `;

  }

  let html = "";

  for (
    const member of
    CACHE.analysisMembers
  ) {

    html += `
      <div
        style="
          margin-top:16px;
          padding-top:12px;
          border-top:1px solid #ddd;
        "
      >

        <h4>
          ${escapeHtml(
            member.memberName
          )}
        </h4>
    `;

    if (
      !member.files ||
      member.files.length === 0
    ) {

      html += `
        <p class="muted">
          分析結果はありません
        </p>
      `;

    } else {

      html += `
        <div
          style="
            display:flex;
            flex-direction:column;
            gap:8px;
          "
        >
      `;

      for (
        const file of
        member.files
      ) {

        html += `
          <div
            style="
              padding:12px;
              border:1px solid #ddd;
              border-radius:8px;
              background:#fafafa;
            "
          >

            <div
              style="
                font-weight:bold;
                margin-bottom:4px;
              "
            >
              ${escapeHtml(
                file.displayDate
              )}
            </div>

            <div
              class="muted"
              style="
                font-size:13px;
              "
            >
              ${escapeHtml(
                file.fileName
              )}
            </div>

          </div>
        `;

      }

      html += `
        </div>
      `;

    }

    html += `
      </div>
    `;

  }

  return html;

}


// =======================
// 分析結果一覧の再読み込み
// =======================
async function reloadAnalysisList() {

  CACHE.analysisMembers = null;
  CACHE.analysisError = null;

  await loadHome();

}


// =======================
// スケジュール取得
// =======================
async function loadSchedule() {

  if (CACHE.schedules) {
    return;
  }

  const data = await apiGet(
    "getScheduleByLineId",
    {
      lineUserId: CACHE.profile.userId
    }
  );

  CACHE.schedules =
    data.schedules || [];

}


// =======================
// カレンダー表示
// =======================
async function showSchedule() {

  lockUI("スケジュールを取得中...");

  try {

    await loadSchedule();

    renderSchedule();

  } catch (error) {

    alert(error.message);

  } finally {

    unlockUI();

  }

}


function renderSchedule() {

  const year =
    currentCalendarDate.getFullYear();

  const month =
    currentCalendarDate.getMonth();

  const startWeek =
    new Date(year, month, 1).getDay();

  const totalDays =
    new Date(year, month + 1, 0).getDate();

  let cells = "<tr>";
  let cellCount = 0;

  for (
    let i = 0;
    i < startWeek;
    i++, cellCount++
  ) {

    cells += "<td></td>";

  }

  for (
    let day = 1;
    day <= totalDays;
    day++, cellCount++
  ) {

    const date =
      `${year}/` +
      `${String(month + 1).padStart(2, "0")}/` +
      `${String(day).padStart(2, "0")}`;

    const schedules =
      CACHE.schedules.filter(
        item => item.date === date
      );

    const mark =
      schedules.length
        ? scheduleMark(schedules[0].type)
        : "";

    const className =
      schedules.length
        ? "has-schedule"
        : "";

    const click =
      schedules.length
        ? `onclick="showScheduleDetail('${date}')"`
        : "";

    cells += `
      <td
        class="${className}"
        ${click}
      >
        ${day}<br>
        ${mark}
      </td>
    `;

    if (
      (cellCount + 1) % 7 === 0 &&
      day !== totalDays
    ) {

      cells += "</tr><tr>";

    }

  }

  while (cellCount % 7 !== 0) {

    cells += "<td></td>";
    cellCount++;

  }

  cells += "</tr>";

  document.getElementById("status").innerHTML = `
    <section class="card">

      <div class="calendar-head">

        <button onclick="changeMonth(-1)">
          ◀
        </button>

        <h2>
          ${year}年${month + 1}月
        </h2>

        <button onclick="changeMonth(1)">
          ▶
        </button>

      </div>

      <table>

        <thead>
          <tr>
            <th>日</th>
            <th>月</th>
            <th>火</th>
            <th>水</th>
            <th>木</th>
            <th>金</th>
            <th>土</th>
          </tr>
        </thead>

        <tbody>
          ${cells}
        </tbody>

      </table>

      <p class="muted">
        ● 通常　
        ★ 振替可　
        ▲ 雨天　
        ■ 休講
      </p>

      <button
        class="secondary"
        onclick="renderHome()"
      >
        ホームへ戻る
      </button>

    </section>
  `;

}


// =======================
// スケジュール記号
// =======================
function scheduleMark(type) {

  return {
    "通常": "●",
    "振替可": "★",
    "雨天": "▲",
    "休講": "■"
  }[type] || "●";

}


// =======================
// スケジュール詳細
// =======================
function showScheduleDetail(date) {

  const schedules =
    CACHE.schedules.filter(
      item => item.date === date
    );

  if (!schedules.length) {
    return;
  }

  const details =
    schedules
      .map(item => `
        <hr>

        <p>
          <strong>
            ${escapeHtml(item.className)}
          </strong>
        </p>

        <p>
          ${escapeHtml(item.startTime)}
          ～
          ${escapeHtml(item.endTime)}
        </p>

        <p>
          ${escapeHtml(item.place)}
        </p>

        <p>
          ${escapeHtml(item.type)}
        </p>
      `)
      .join("");

  document
    .getElementById("scheduleModalContent")
    .innerHTML = `
      <h3>${escapeHtml(date)}</h3>

      ${details}

      <button
        class="secondary"
        onclick="closeScheduleModal()"
      >
        閉じる
      </button>
    `;

  document
    .getElementById("scheduleModal")
    .style.display = "block";

}


// =======================
// モーダルを閉じる
// =======================
function closeScheduleModal(event) {

  if (
    event &&
    event.target.id !== "scheduleModal"
  ) {
    return;
  }

  document
    .getElementById("scheduleModal")
    .style.display = "none";

}


// =======================
// 前月・翌月
// =======================
function changeMonth(amount) {

  currentCalendarDate = new Date(
    currentCalendarDate.getFullYear(),
    currentCalendarDate.getMonth() + amount,
    1
  );

  renderSchedule();

}


// =======================
// 起動
// =======================
main();
</script>

</body>
</html>
