<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>4TUNE School App</title>

    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

    <style>
      body {
        font-family: sans-serif;
        margin: 0;
        background: #f5f7f6;
        color: #222;
      }

      main {
        max-width: 560px;
        margin: 0 auto;
        padding: 20px;
      }

      main.analysis-screen {
        padding: 8px;
      }

      .card {
        background: #fff;
        border-radius: 12px;
        padding: 16px;
        margin-bottom: 14px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
      }

      input,
      button {
        box-sizing: border-box;
        font: inherit;
      }

      input {
        width: 100%;
        padding: 11px;
        margin: 5px 0 10px;
        border: 1px solid #ccc;
        border-radius: 8px;
      }

      button {
        padding: 10px 14px;
        margin: 4px 2px;
        border: 0;
        border-radius: 8px;
        background: #4f9c8a;
        color: #fff;
        cursor: pointer;
      }

      button.secondary {
        background: #777;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        table-layout: fixed;
        background: #fff;
      }

      th,
      td {
        border: 1px solid #ddd;
        padding: 7px 2px;
        text-align: center;
      }

      td {
        height: 54px;
        vertical-align: top;
      }

      td.has-schedule {
        cursor: pointer;
        background: #edf7f4;
      }

      .calendar-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .muted {
        color: #666;
      }

      #scheduleModal {
        display: none;
        position: fixed;
        inset: 0;
        padding: 20px;
        background: rgba(0, 0, 0, 0.5);
        z-index: 10;
      }

      #scheduleModalContent {
        max-width: 420px;
        margin: 80px auto;
        background: #fff;
        border-radius: 12px;
        padding: 20px;
      }
      .analysis-result-button {
        width: 100%;
        margin-top: 6px;
      }

      .analysis-view-card {
        padding: 10px;
        margin-bottom: 0;
      }

      .course-analysis-placeholder {
        padding: 24px 14px;
        border: 1px solid #dfe7e4;
        border-radius: 12px;
        background: #f5f8f7;
        text-align: center;
      }

      .course-analysis-placeholder h3 {
        margin: 0 0 8px;
        color: #2f4f47;
      }

      .course-analysis-placeholder p {
        margin: 4px 0;
      }

      .d-analysis-scroll {
        width: 100%;
        overflow: hidden;
        padding: 2px 0 4px;
      }

      .d-overview-canvas {
        display: block;
        width: 100%;
        height: auto;
        border: 1px solid #d8dddb;
        border-radius: 10px;
        background: #fff;
      }

      .d-analysis-result-title {
        margin: 5px 0 0;
        color: #3f5d55;
        font-size: 12px;
        font-weight: bold;
      }

      .stick-header {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 4px;
      }

      .stick-header button {
        flex: 0 0 auto;
        min-height: 26px;
        margin: 0;
        padding: 3px 8px;
        border-radius: 6px;
        font-size: 11px;
      }

      .analysis-date-tabs {
        display: flex;
        flex: 1 1 auto;
        gap: 4px;
        min-width: 0;
        overflow-x: auto;
        padding: 1px 0 3px;
        scrollbar-width: thin;
        -webkit-overflow-scrolling: touch;
      }

      .stick-header .analysis-date-tab {
        border: 1px solid #cdd9d5;
        background: #f4f7f6;
        color: #52605c;
        white-space: nowrap;
      }

      .stick-header .analysis-date-tab.is-active {
        border-color: #4f9c8a;
        background: #4f9c8a;
        color: #fff;
      }

      .stick-canvas-wrap {
        width: 100%;
        overflow: hidden;
        border: 1px solid #d8dddb;
        border-radius: 12px;
        background: #fff;
      }

      #stickCanvas {
        display: block;
        width: 100%;
        height: auto;
        background: #fff;
        touch-action: none;
      }

      .analysis-tabs {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 2px;
        margin-top: 4px;
        padding: 2px;
        border-radius: 7px;
        background: #e9eeec;
      }

      .analysis-tab-button {
        min-height: 26px;
        margin: 0;
        padding: 2px;
        border: 0;
        border-radius: 5px;
        background: transparent;
        color: #4d5754;
        font-size: 11px;
        font-weight: bold;
      }

      .analysis-tab-button.is-active {
        background: #4f9c8a;
        color: #fff;
      }

      .analysis-tab-panel {
        display: none;
        padding-top: 4px;
      }

      .analysis-tab-panel.is-active {
        display: block;
      }

      .analysis-tab-placeholder {
        margin: 0;
        padding: 18px 8px;
        border-radius: 8px;
        background: #f5f7f6;
        color: #777;
        text-align: center;
        font-size: 12px;
      }

      .basic-info-grid {
        display: grid;
        grid-template-columns: repeat(6, minmax(0, 1fr));
        gap: 6px;
        padding-top: 4px;
      }

      .basic-info-item {
        grid-column: span 2;
        padding: 10px 3px;
        border: 1px solid #dfe7e4;
        border-radius: 9px;
        background: #f5f7f6;
        text-align: center;
      }

      .basic-info-item:nth-child(4),
      .basic-info-item:nth-child(5) {
        grid-column: span 3;
      }

      .basic-info-item:nth-child(3) {
        border-color: #4f9c8a;
        background: #e6f3ef;
        box-shadow: 0 1px 4px rgba(79, 156, 138, 0.16);
      }

      .basic-info-label {
        margin-bottom: 5px;
        color: #56615e;
        font-size: 11px;
        font-weight: bold;
      }

      .basic-info-value {
        color: #222;
        font-size: 18px;
        font-weight: bold;
        line-height: 1.2;
      }

      .basic-info-unit {
        margin-left: 2px;
        color: #69736f;
        font-size: 10px;
        font-weight: normal;
      }

      .analysis-graph-card {
        padding: 5px 8px 6px;
        border: 1px solid #dfe7e4;
        border-radius: 9px;
        background: #fff;
      }

      .graph-selector-row {
        display: flex;
        align-items: center;
        justify-content: flex-start;
        gap: 5px;
        margin: 0 0 6px;
      }

      .graph-selector {
        min-width: 0;
        width: 128px;
        height: 32px;
        margin: 0;
        padding: 2px 28px 2px 9px;
        border: 1px solid #bdc9c5;
        border-radius: 6px;
        background: #fff;
        color: #27312e;
        font-size: 12px;
        font-weight: bold;
      }

      .graph-part-selector {
        width: 142px;
      }

      .graph-overlay-toggle {
        flex: none;
        min-width: 48px;
        height: 32px;
        margin: 0;
        padding: 2px 8px;
        border: 1px solid #4f9c8a;
        border-radius: 16px;
        background: #4f9c8a;
        color: #fff;
        font-size: 11px;
        font-weight: bold;
      }

      .graph-overlay-toggle.is-off {
        border-color: #aeb9b5;
        background: #fff;
        color: #69736f;
      }

      .graph-content-panel {
        display: none;
      }

      .graph-content-panel.is-active {
        display: block;
      }

      .graph-coming-soon {
        margin: 0;
        padding: 54px 8px;
        border: 1px solid #dfe7e4;
        border-radius: 9px;
        background: #f5f7f6;
        color: #777;
        text-align: center;
        font-size: 12px;
      }

      .analysis-graph-header {
        display: flex;
        align-items: baseline;
        justify-content: flex-end;
        margin: 0 4px -1px;
      }

      .analysis-graph-current {
        display: inline-block;
        color: #4f9c8a;
        font-size: 12px;
        font-weight: bold;
        transform: translateY(3px);
      }

      #centerOfMassGraph,
      #jointAngleGraph,
      #jointContractionVelocityGraph {
        display: block;
        width: 100%;
        max-width: 100%;
        height: auto;
        background: #fff;
      }

      .stick-controls {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 4px;
        margin-top: 4px;
      }

      .stick-controls button {
        flex: none;
        width: 70px;
        min-height: 32px;
        margin: 0;
        padding: 3px 4px;
        font-size: 11px;
        font-weight: bold;
        border-radius: 6px;
      }

      .stick-controls .play-button {
        width: 82px;
        background: #4f9c8a;
        font-size: 12px;
      }

      .stick-settings {
        margin: 0 0 6px;
        padding: 7px 9px;
        border-radius: 8px;
        background: #f5f7f6;
      }

      .stick-slider-group + .stick-slider-group {
        margin-top: 6px;
      }

      .stick-slider-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 1px;
        font-size: 12px;
        font-weight: bold;
      }

      .stick-slider {
        width: 100%;
        margin: 0;
        padding: 0;
        accent-color: #4f9c8a;
      }

      .speed-scale {
        display: flex;
        justify-content: space-between;
        margin-top: 0;
        color: #666;
        font-size: 9px;
        line-height: 1;
      }

      .stick-loop-button {
        width: 100%;
        min-height: 34px;
        margin: 6px 0 0;
        padding: 5px;
        font-size: 12px;
        background: #777;
      }

      .stick-loop-button.is-active {
        background: #4f9c8a;
      }

      .stick-trajectory-button {
        width: 100%;
        min-height: 34px;
        margin: 6px 0 0;
        padding: 5px;
        font-size: 12px;
        background: #777;
      }

      .stick-trajectory-button.is-active {
        background: #4f9c8a;
      }
    </style>
  </head>

  <body>
    <main id="status">読み込み中...</main>

    <div id="scheduleModal" onclick="closeScheduleModal(event)">
      <div id="scheduleModalContent"></div>
    </div>

    <script>
      const GAS_URL =
        "https://script.google.com/macros/s/AKfycbzjPkLxYBJeBGk9yehLHfUUMhJmQUfxNiaVHyNqjd9MeAqkWOIINjIUBXsxIEpwqa78Mw/exec";

      const LIFF_ID = "2010350476-xCTsckal";

      const CACHE = {
        profile: null,
        members: null,
        schedules: null,

        // 分析ファイル一覧
        analysisMembers: null,
        analysisError: null,

        // 読み込み済みの分析データ
        analysisData: {},

        // 読み込み済みのDコース分析データ
        dAnalysisData: {},
      };

      let stickViewer = null;
      let centerOfMassGraph = null;
      let jointAngleGraph = null;
      let jointContractionVelocityGraph = null;
      let currentAnalysisData = null;
      let graphOverlayEnabled = true;

      const JOINT_ANGLE_POINTS = {
        rightElbow: [1, 2, 3],
        rightShoulder: [2, 3, 13],
        leftElbow: [5, 6, 7],
        leftShoulder: [6, 7, 19],
        rightHip: [3, 13, 12],
        rightKnee: [13, 12, 11],
        rightAnkle: [12, 11, 9],
        leftHip: [7, 19, 18],
        leftKnee: [19, 18, 17],
        leftAnkle: [18, 17, 15],
      };

      const STICK_COLORS = {
        right: "#1565c0",
        left: "#e53935",
        center: "#263238",
        forwardLean: "#ffffff",
        forwardLeanBorder: "#78909c",
      };

      const RIGHT_JOINTS = new Set([0, 1, 2, 3, 8, 9, 10, 11, 12, 13]);

      const LEFT_JOINTS = new Set([4, 5, 6, 7, 14, 15, 16, 17, 18, 19]);

      const STICK_BONES = [
        [0, 1],
        [1, 2],
        [2, 3],
        [4, 5],
        [5, 6],
        [6, 7],

        [8, 9],
        [9, 10],
        [10, 11],
        [11, 12],
        [12, 13],

        [14, 15],
        [15, 16],
        [16, 17],
        [17, 18],
        [18, 19],

        [3, 7],
        [3, 22],
        [7, 22],

        [13, 19],
        [3, 13],
        [7, 19],

        [20, 21],
        [21, 22],
      ];

      let currentCalendarDate = new Date();
      let uiLockCount = 0;

      // =======================
      // 初期処理
      // =======================
      async function main() {
        lockUI("読み込み中...");

        try {
          await liff.init({
            liffId: LIFF_ID,
          });

          if (!liff.isLoggedIn()) {
            liff.login();
            return;
          }

          CACHE.profile = await liff.getProfile();

          const parent = await apiGet("getParentByLineId", {
            lineUserId: CACHE.profile.userId,
          });

          if (!parent.exists) {
            showRegister(CACHE.profile.userId);
            return;
          }

          await loadHome();
        } catch (error) {
          showError(error);
        } finally {
          unlockUI();
        }
      }

      // =======================
      // API通信
      // =======================
      async function apiGet(action, params = {}) {
        const query = new URLSearchParams({
          action,
          ...params,
        });

        const response = await fetch(`${GAS_URL}?${query.toString()}`);

        if (!response.ok) {
          throw new Error("データの取得に失敗しました");
        }

        return response.json();
      }

      async function apiPost(data) {
        const response = await fetch(GAS_URL, {
          method: "POST",
          body: JSON.stringify(data),
        });

        if (!response.ok) {
          throw new Error("データの登録に失敗しました");
        }

        return response.json();
      }

      // =======================
      // UIロック
      // =======================
      function lockUI(text = "処理中...") {
        uiLockCount++;

        document.body.style.pointerEvents = "none";
        document.body.style.opacity = "0.65";

        const status = document.getElementById("status");

        if (status && text) {
          status.textContent = text;
        }
      }

      function unlockUI() {
        uiLockCount = Math.max(0, uiLockCount - 1);

        if (uiLockCount === 0) {
          document.body.style.pointerEvents = "auto";
          document.body.style.opacity = "1";
        }
      }

      // =======================
      // HTMLエスケープ
      // =======================
      function escapeHtml(value) {
        return String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      // =======================
      // エラー画面
      // =======================
      function showError(error) {
        console.error(error);

        document.getElementById("status").innerHTML = `
    <section class="card">

      <h2>読み込みに失敗しました</h2>

      <p class="muted">
        通信環境を確認して、もう一度お試しください
      </p>

      <button onclick="location.reload()">
        再読み込み
      </button>

    </section>
  `;
      }

      // =======================
      // 初回登録画面
      // =======================
      function showRegister(lineUserId) {
        document.getElementById("status").innerHTML = `
    <section class="card">

      <h2>初回登録</h2>

      <label>
        保護者名

        <input
          id="parentName"
          placeholder="例：山田太郎"
        >
      </label>

      <h3>お子さま</h3>

      <div id="childrenArea">

        <div class="childRow">

          <input
            class="childName"
            placeholder="子ども名"
          >

          <input
            class="childCourse"
            placeholder="クラスID・コース"
          >

        </div>

      </div>

      <button
        class="secondary"
        onclick="addChildRow()"
      >
        ＋ お子さまを追加
      </button>

      <button
        onclick="registerAll('${lineUserId}')"
      >
        登録する
      </button>

    </section>
  `;
      }

      // =======================
      // 子どもの入力欄を追加
      // =======================
      function addChildRow() {
        const row = document.createElement("div");

        row.className = "childRow";

        row.innerHTML = `
    <input
      class="childName"
      placeholder="子ども名"
    >

    <input
      class="childCourse"
      placeholder="クラスID・コース"
    >
  `;

        document.getElementById("childrenArea").appendChild(row);
      }

      // =======================
      // 保護者・子どもの登録
      // =======================
      async function registerAll(lineUserId) {
        const parentName = document.getElementById("parentName").value.trim();

        const names = [...document.querySelectorAll(".childName")];

        const courses = [...document.querySelectorAll(".childCourse")];

        const children = names
          .map((input, index) => ({
            name: input.value.trim(),
            course: courses[index].value.trim(),
          }))
          .filter((child) => child.name);

        if (!parentName) {
          alert("保護者名を入力してください");
          return;
        }

        if (children.length === 0) {
          alert("お子さまの名前を入力してください");
          return;
        }

        lockUI("登録中...");

        try {
          const parent = await apiPost({
            action: "createParent",
            lineUserId,
            name: parentName,
          });

          if (!parent.success) {
            throw new Error(parent.message || "保護者登録に失敗しました");
          }

          for (const child of children) {
            const result = await apiPost({
              action: "addMember",
              parentId: parent.parentId,
              ...child,
            });

            if (!result.success) {
              throw new Error(result.message || "会員登録に失敗しました");
            }
          }

          alert("登録が完了しました");

          location.reload();
        } catch (error) {
          alert(error.message);
        } finally {
          unlockUI();
        }
      }

      // =======================
      // ホーム画面の読み込み
      // =======================
      async function loadHome() {
        lockUI("会員情報を取得中...");

        try {
          // =====================
          // 会員情報取得
          // =====================
          if (!CACHE.members) {
            const memberData = await apiGet("getMembersByLineId", {
              lineUserId: CACHE.profile.userId,
            });

            CACHE.members = memberData.members || [];
          }

          // =====================
          // 分析ファイル一覧取得
          // =====================
          if (!CACHE.analysisMembers) {
            try {
              const analysisData = await apiGet("getAnalysisFileList", {
                lineUserId: CACHE.profile.userId,
              });

              if (analysisData.success) {
                CACHE.analysisMembers = analysisData.members || [];

                CACHE.analysisError = null;
              } else {
                CACHE.analysisMembers = [];

                CACHE.analysisError =
                  analysisData.message || "分析結果を取得できませんでした";

                alert("分析ファイル取得失敗\n\n" + CACHE.analysisError);
              }
            } catch (error) {
              console.error("分析結果一覧の取得エラー", error);

              CACHE.analysisMembers = [];

              CACHE.analysisError = "分析結果を取得できませんでした";

              alert("分析API通信エラー\n\n" + error.message);
            }
          }

          renderHome();
        } finally {
          unlockUI();
        }
      }

      // =======================
      // ホーム画面
      // =======================
      function renderHome() {
        document.getElementById("status").classList.remove("analysis-screen");

        const membersHtml = CACHE.members.length
          ? CACHE.members
              .map(
                (member) => `
              <li>
                ${escapeHtml(member.name)}
              </li>
            `,
              )
              .join("")
          : `
          <li>
            登録会員はいません
          </li>
        `;

        const analysisHtml = createAnalysisListHtml();

        document.getElementById("status").innerHTML = `

      <section class="card">

        <h2>
          こんにちは
          ${escapeHtml(CACHE.profile.displayName)}
          さま
        </h2>

        <h3>登録会員</h3>

        <ul>
          ${membersHtml}
        </ul>

      </section>

      <section class="card">

        <h3>最新の動作分析結果</h3>

        ${analysisHtml}

      </section>

      <section class="card">

        <h3>
          スクールスケジュール
        </h3>

        <button
          onclick="showSchedule()"
        >
          カレンダーを見る
        </button>

      </section>
    `;
      }

      // =======================
      // 動作分析結果一覧の作成
      // =======================
      function createAnalysisListHtml() {
        if (CACHE.analysisError) {
          return `
      <p class="muted">
        ${escapeHtml(CACHE.analysisError)}
      </p>

      <button
        onclick="reloadAnalysisList()"
      >
        再読み込み
      </button>
    `;
        }

        if (!CACHE.analysisMembers || CACHE.analysisMembers.length === 0) {
          return `
      <p class="muted">
        現在、表示できる分析結果はありません
      </p>
    `;
        }

        let html = "";

        for (const member of CACHE.analysisMembers) {
          html += `
      <div
        style="
          margin-top:16px;
          padding-top:12px;
          border-top:1px solid #ddd;
        "
      >

        <h4>
          ${escapeHtml(member.memberName)}
        </h4>
    `;

          if (!member.files || member.files.length === 0) {
            html += `
        <p class="muted">
          分析結果はありません
        </p>
      `;
          } else {
            html += `
        <div
          style="
            display:flex;
            flex-direction:column;
            gap:8px;
          "
        >
      `;

            for (const file of member.files.slice(0, 1)) {
              html += `
          <div
            style="
              padding:12px;
              border:1px solid #ddd;
              border-radius:8px;
              background:#fafafa;
            "
          >

            <div
              style="
                font-weight:bold;
                margin-bottom:4px;
              "
            >
              ${escapeHtml(file.displayDate)}
            </div>

<button
  class="analysis-result-button"
  onclick="openAnalysisResult('${file.fileId}')"
>
  結果を見る
</button>

          </div>
        `;
            }

            html += `
        </div>
      `;
          }

          html += `
      </div>
    `;
        }

        return html;
      }

      // =======================
      // 分析結果を開く
      // =======================
      function findAnalysisContext(fileId) {
        for (const member of CACHE.analysisMembers || []) {
          const file = (member.files || []).find(function (item) {
            return item.fileId === fileId;
          });

          if (file) {
            return {
              member: member,
              file: file,
              courseId: String(member.courseId || "").trim().toUpperCase(),
            };
          }
        }

        return null;
      }

      async function openAnalysisResult(fileId) {
        const analysisContext = findAnalysisContext(fileId);

        if (!analysisContext) {
          alert("分析結果の会員情報を確認できませんでした");
          return;
        }

        if (["D001", "D002"].includes(analysisContext.courseId)) {
          await loadDAnalysisResult(analysisContext);
          return;
        }

        if (!["S001", "S002"].includes(analysisContext.courseId)) {
          alert(
            "会員マスタD列のコースIDを確認してください\n\n現在の設定：" +
              (analysisContext.courseId || "空欄"),
          );
          return;
        }

        /*
         * 前のビューアが動いていた場合は停止
         */
        if (stickViewer) {
          stickViewer.destroy();
          stickViewer = null;
        }

        lockUI("分析結果を読み込み中...");

        try {
          let data = CACHE.analysisData[fileId];

          /*
           * 未取得の場合だけGASから読み込む
           */
          if (!data) {
            data = await apiGet("getAnalysisData", {
              lineUserId: CACHE.profile.userId,

              fileId: fileId,
            });

            if (!data.success) {
              throw new Error(data.message || "分析結果を読み込めませんでした");
            }

            /*
             * 同じ結果を再度開いた場合に
             * 通信しないようキャッシュ
             */
            CACHE.analysisData[fileId] = data;
          }

          renderStickViewer(data);
        } catch (error) {
          console.error(error);

          alert(error.message || "分析結果を読み込めませんでした");

          renderHome();
        } finally {
          unlockUI();
        }
      }

      // スティック画面表示
      // =======================
      function formatBasicAnalysisValue(value) {
        if (value === null || value === undefined || value === "") {
          return "-";
        }

        const numberValue = Number(value);

        if (!Number.isFinite(numberValue)) {
          return "-";
        }

        return numberValue.toFixed(2);
      }

      // =======================
      // 表示中の会員の日付タブ
      // =======================
      function createAnalysisDateTabsHtml(data) {
        const member = (CACHE.analysisMembers || []).find(function (item) {
          if (data.memberId && item.memberId === data.memberId) {
            return true;
          }

          return (item.files || []).some(function (file) {
            return file.fileId === data.fileId;
          });
        });

        if (!member || !member.files || member.files.length === 0) {
          return "";
        }

        return member.files
          .map(function (file) {
            const isActive = file.fileId === data.fileId;

            return `
              <button
                class="analysis-date-tab${isActive ? " is-active" : ""}"
                type="button"
                role="tab"
                aria-selected="${String(isActive)}"
                title="${escapeHtml(file.fileName)}"
                onclick="switchAnalysisDate('${file.fileId}')"
              >
                ${escapeHtml(file.displayDate)}
              </button>
            `;
          })
          .join("");
      }

        if (!fileId || fileId === currentAnalysisData?.fileId) {

        delete CACHE.analysisData[fileId];

        await openAnalysisResult(fileId);

      // =======================

      function switchAnalysisTab(tabName) {
        const tabNames = ["controls", "basic", "graphs"];

        if (!tabNames.includes(tabName)) {
          return;
        }

        for (const name of tabNames) {
          const isActive = name === tabName;
          const button = document.getElementById("analysisTabButton-" + name);
          const panel = document.getElementById("analysisTab-" + name);

          if (button) {
            button.classList.toggle("is-active", isActive);
            button.setAttribute("aria-selected", String(isActive));
          }

          if (panel) {
            panel.classList.toggle("is-active", isActive);
            panel.hidden = !isActive;
          }
        }

        updateStickGraphOverlay();

        if (tabName === "graphs" && centerOfMassGraph) {
          requestAnimationFrame(function () {
            centerOfMassGraph.draw();
          });
        }
      }

      // =======================
      // 表示グラフ切り替え
      // =======================
      function switchAnalysisGraph(graphName) {
        const graphNames = [
          "centerOfMass",
          "jointAngle",
          "jointAngularVelocity",
        ];

        if (!graphNames.includes(graphName)) {
          return;
        }

        const partSelect = document.getElementById("analysisGraphPartSelect");

        if (partSelect) {
          partSelect.hidden = graphName === "centerOfMass";
        }

        updateStickGraphOverlay();

        for (const name of graphNames) {
          const panel = document.getElementById("analysisGraph-" + name);
          const isActive = name === graphName;

          if (panel) {
            panel.classList.toggle("is-active", isActive);
            panel.hidden = !isActive;
          }
        }

        if (graphName === "centerOfMass" && centerOfMassGraph) {
          requestAnimationFrame(function () {
            centerOfMassGraph.draw();
          });
        }

        if (graphName === "jointAngle" && jointAngleGraph) {
          requestAnimationFrame(function () {
            jointAngleGraph.draw();
          });
        }

        if (
          graphName === "jointAngularVelocity" &&
          jointContractionVelocityGraph
        ) {
          requestAnimationFrame(function () {
            jointContractionVelocityGraph.draw();
          });
        }
      }

        updateStickGraphOverlay();

      function drawDStickOverview(canvas, poses, movementDirection) {
        const context = canvas.getContext("2d");
        context.fillStyle = "#ffffff";
        context.fillRect(0, 0, canvas.width, canvas.height);

        const chronologicalDefinitions = [
          { stepNumber: 1, phase: "接地" },
          { stepNumber: 1, phase: "離地" },
          { stepNumber: 2, phase: "接地" },
          { stepNumber: 2, phase: "離地" },
          { stepNumber: 3, phase: "接地" },
        ];
        const movesLeft = String(movementDirection || "").includes("左");
        const orderedDefinitions = movesLeft
          ? chronologicalDefinitions.slice().reverse()
          : chronologicalDefinitions;
        const slotWidth = canvas.width / orderedDefinitions.length;
        const groundY = canvas.height - 34;

        context.textAlign = "center";
        context.textBaseline = "middle";
        context.fillStyle = "#111111";
        context.font = "bold 30px sans-serif";

        [1, 2, 3].forEach(function (stepNumber) {
          const matchingSlots = [];

          orderedDefinitions.forEach(function (definition, slotIndex) {
            if (definition.stepNumber === stepNumber) {
              matchingSlots.push(slotIndex + 0.5);
            }
          });

          if (matchingSlots.length > 0) {
            const centerSlot = matchingSlots.reduce(function (sum, value) {
              return sum + value;
            }, 0) / matchingSlots.length;

            context.fillText(stepNumber + "歩目", slotWidth * centerSlot, 31);
          }
        });

        orderedDefinitions.forEach(function (definition, slotIndex) {
          const pose = poses.find(function (item) {
            return Number(item.stepNumber) === definition.stepNumber &&
              String(item.phase) === definition.phase;
          });

          context.fillStyle = "#52605c";
          context.font = "bold 20px sans-serif";
          context.fillText(
            definition.phase,
            slotWidth * (slotIndex + 0.5),
            64,
          );

          if (pose) {
            drawDStickPoseInSlot(
              context,
              pose.row,
              slotWidth * slotIndex,
              slotWidth,
              82,
              groundY,
            );
          }
        });

        context.beginPath();
        context.moveTo(8, groundY + 1);
        context.lineTo(canvas.width - 8, groundY + 1);
        context.lineWidth = 3;
        context.strokeStyle = "#111111";
        context.stroke();
      }

      function drawDStickPoseInSlot(
        context,
        row,
        slotLeft,
        slotWidth,
        topY,
        groundY,
      ) {
        const joints = [];

        for (let column = 0; column < 46; column += 2) {
          const rawX = row?.[column];
          const rawY = row?.[column + 1];
          const x = rawX === null || rawX === "" || rawX === undefined
            ? NaN
            : Number(rawX);
          const y = rawY === null || rawY === "" || rawY === undefined
            ? NaN
            : Number(rawY);

          joints.push(
            Number.isFinite(x) && Number.isFinite(y) ? { x: x, y: y } : null,
          );
        }

        const validPoints = joints.filter(Boolean);

        if (validPoints.length === 0) {
          return;
        }

        const xValues = validPoints.map(function (point) { return point.x; });
        const yValues = validPoints.map(function (point) { return point.y; });
        const minX = Math.min(...xValues);
        const maxX = Math.max(...xValues);
        const minY = Math.min(...yValues);
        const maxY = Math.max(...yValues);
        const width = Math.max(maxX - minX, 0.01);
        const height = Math.max(maxY - minY, 0.01);
        const scale = Math.min(
          (slotWidth - 34) / width,
          (groundY - topY) / height,
        );
        const centerX = (minX + maxX) / 2;

        function toCanvas(point) {
          return {
            x: slotLeft + slotWidth / 2 + (point.x - centerX) * scale,
            y: groundY - (point.y - minY) * scale,
          };
        }

        context.strokeStyle = "#111111";
        context.lineWidth = 3;
        context.lineCap = "round";
        context.lineJoin = "round";

        for (const bone of STICK_BONES) {
          const firstPoint = joints[bone[0]];
          const secondPoint = joints[bone[1]];

          if (!firstPoint || !secondPoint) {
            continue;
          }

          const start = toCanvas(firstPoint);
          const end = toCanvas(secondPoint);

          context.beginPath();
          context.moveTo(start.x, start.y);
          context.lineTo(end.x, end.y);
          context.stroke();
        }

        for (const point of validPoints) {
          const position = toCanvas(point);

          context.beginPath();
          context.arc(position.x, position.y, 5, 0, Math.PI * 2);
          context.fillStyle = "#ff5252";
          context.fill();
        }
      }

      // =======================
      // つま先軌道表示切り替え

      function toggleStickTrajectory() {
        if (stickViewer) {
          stickViewer.toggleFootTrajectory();

      // =======================

      // =======================
      // 再生速度変更

      function changeStickSpeed(index) {

        if (display) {

      // =======================
      // 軽量グラフ
      // =======================
      class LightweightLineGraph {
        constructor(canvas, currentValueElement, options = {}) {
          this.canvas = canvas;
          this.context = canvas.getContext("2d");
          this.currentValueElement = currentValueElement;
          this.yAxisLabel = options.yAxisLabel || "";
          this.unit = options.unit || "";
          this.precision = Number.isInteger(options.precision)
            ? options.precision
            : 2;
          this.values = [];
          this.fps = 30;
          this.currentFrame = 0;
          this.margin = {
            left: 46,
            right: 18,
            top: 14,
            bottom: 56,
          };
        }

        setData(values, fps) {
          this.values = Array.isArray(values)
            ? values.map(function (value) {
                const numberValue = Number(value);

                return value !== null &&
                  value !== "" &&
                  Number.isFinite(numberValue)
                  ? numberValue
                  : null;
              })
            : [];

          this.fps = Number(fps) > 0 ? Number(fps) : 30;
          this.currentFrame = 0;
          this.draw();
        }

        setCurrentFrame(frameIndex) {
          const lastIndex = Math.max(0, this.values.length - 1);
          const numberValue = Number(frameIndex);

          this.currentFrame = Number.isFinite(numberValue)
            ? Math.max(0, Math.min(Math.floor(numberValue), lastIndex))
            : 0;

          this.draw();
        }

        getValidValues() {
          return this.values.filter(function (value) {
            return typeof value === "number" && Number.isFinite(value);
          });
        }

        getYRange() {
          const validValues = this.getValidValues();

          if (validValues.length === 0) {
            return {
              min: 0,
              max: 1,
            };
          }

          const minimum = Math.min(...validValues);
          const maximum = Math.max(...validValues);
          const span =
            maximum - minimum || Math.max(Math.abs(maximum), 1) * 0.1;

          let min = minimum - span * 0.1;
          let max = maximum + span * 0.1;

          if (minimum > 0 && min < 0) {
            min = 0;
          }

          if (maximum < 0 && max > 0) {
            max = 0;
          }

          return {
            min: min,
            max: max,
          };
        }

        mapX(frameIndex) {
          const plotWidth =
            this.canvas.width - this.margin.left - this.margin.right;
          const lastIndex = Math.max(1, this.values.length - 1);

          return this.margin.left + (frameIndex / lastIndex) * plotWidth;
        }

        mapY(value, min, max) {
          const plotHeight =
            this.canvas.height - this.margin.top - this.margin.bottom;
          const ratio = (value - min) / (max - min || 1);

          return this.canvas.height - this.margin.bottom - ratio * plotHeight;
        }

        draw() {
          const context = this.context;
          const width = this.canvas.width;
          const height = this.canvas.height;

          context.clearRect(0, 0, width, height);
          context.fillStyle = "#ffffff";
          context.fillRect(0, 0, width, height);

          const range = this.getYRange();

          this.drawGridAndAxes(range.min, range.max);
          this.drawLine(range.min, range.max);
          this.drawCurrentPoint(range.min, range.max);
          this.updateCurrentValue();
        }

        drawGridAndAxes(min, max) {
          const context = this.context;
          const plotLeft = this.margin.left;
          const plotRight = this.canvas.width - this.margin.right;
          const plotTop = this.margin.top;
          const plotBottom = this.canvas.height - this.margin.bottom;
          const yTickCount = 5;
          const xTickCount = 4;

          context.font = "11px sans-serif";
          context.lineWidth = 1;

          for (let index = 0; index <= yTickCount; index++) {
            const value = min + ((max - min) * index) / yTickCount;
            const y = this.mapY(value, min, max);

            context.strokeStyle = "#e3e9e7";
            context.beginPath();
            context.moveTo(plotLeft, y);
            context.lineTo(plotRight, y);
            context.stroke();

            context.fillStyle = "#65706c";
            context.textAlign = "right";
            context.textBaseline = "middle";
            context.fillText(value.toFixed(2), plotLeft - 7, y);
          }

          const lastIndex = Math.max(0, this.values.length - 1);

          for (let index = 0; index <= xTickCount; index++) {
            const frameIndex = (lastIndex * index) / xTickCount;
            const x = this.mapX(frameIndex);
            const seconds = frameIndex / this.fps;

            context.strokeStyle = "#eef2f0";
            context.beginPath();
            context.moveTo(x, plotTop);
            context.lineTo(x, plotBottom);
            context.stroke();

            context.fillStyle = "#65706c";
            context.textAlign = "center";
            context.textBaseline = "top";
            context.fillText(seconds.toFixed(2), x, plotBottom + 8);
          }

          context.strokeStyle = "#53605c";
          context.lineWidth = 1.5;
          context.beginPath();
          context.moveTo(plotLeft, plotTop);
          context.lineTo(plotLeft, plotBottom);
          context.lineTo(plotRight, plotBottom);
          context.stroke();

          context.fillStyle = "#53605c";
          context.font = "12px sans-serif";
          context.textAlign = "center";
          context.textBaseline = "bottom";
          context.fillText(
            "時間（秒）",
            (plotLeft + plotRight) / 2,
            this.canvas.height - 3,
          );

        }

        drawLine(min, max) {
          const context = this.context;
          let lineStarted = false;

          context.beginPath();
          context.strokeStyle = "#4f9c8a";
          context.lineWidth = 3;
          context.lineJoin = "round";
          context.lineCap = "round";

          this.values.forEach((value, index) => {
            if (typeof value !== "number" || !Number.isFinite(value)) {
              lineStarted = false;
              return;
            }

            const x = this.mapX(index);
            const y = this.mapY(value, min, max);

            if (!lineStarted) {
              context.moveTo(x, y);
              lineStarted = true;
            } else {
              context.lineTo(x, y);
            }
          });

          context.stroke();
        }

        drawCurrentPoint(min, max) {
          const value = this.values[this.currentFrame];

          if (typeof value !== "number" || !Number.isFinite(value)) {
            return;
          }

          const context = this.context;
          const x = this.mapX(this.currentFrame);
          const y = this.mapY(value, min, max);

          context.strokeStyle = "rgba(239, 83, 80, 0.35)";
          context.lineWidth = 1;
          context.beginPath();
          context.moveTo(x, this.margin.top);
          context.lineTo(x, this.canvas.height - this.margin.bottom);
          context.stroke();

          context.fillStyle = "#ef5350";
          context.beginPath();
          context.arc(x, y, 6, 0, Math.PI * 2);
          context.fill();

          context.strokeStyle = "#ffffff";
          context.lineWidth = 2;
          context.stroke();
        }

        updateCurrentValue() {
          if (!this.currentValueElement) {
            return;
          }

          const value = this.values[this.currentFrame];

          this.currentValueElement.textContent =
            typeof value === "number" && Number.isFinite(value)
              ? value.toFixed(this.precision) + this.unit
              : "-" + this.unit;
        }
      }

      // =======================
      // 軽量スティックビューア
      // =======================
      class LightweightStickViewer {
        constructor(
          canvas,
          playButton,
          loopButton,
          trajectoryButton,
          memberName,
        ) {
          this.canvas = canvas;

          this.context = canvas.getContext("2d");

          this.playButton = playButton;

          this.loopButton = loopButton;

          this.trajectoryButton = trajectoryButton;

          this.memberName = String(memberName || "");

          this.frames = [];

          this.centerOfMassPoints = [];

          this.graphOverlayVisible = false;

          this.graphOverlayName = "centerOfMass";

          this.graphOverlayPart = "rightElbow";

          this.frameIndex = 0;

          this.fps = 30;

          this.playSpeed = 1;

          this.isPlaying = false;

          this.loopEnabled = false;

          this.footTrajectoryEnabled = false;

          this.firstStepFoot = "";

          this.trajectoryJointIndex = null;

          this.animationId = null;

          this.lastTime = 0;

          this.accumulatedTime = 0;

          /*
           * 将来のサイズ変更用
           */
          this.zoom = 1;

          this.fitScale = 100;

          this.centerX = 0;
          this.centerY = 0;
        }

        // =====================
        // データ設定
        // =====================
        setData(
          rows,
          fps,
          centerOfMassPoints,
          movementDirection,
          firstStepFoot,
        ) {
          this.stop();

          this.movementDirection = String(movementDirection || "右").trim();

          this.firstStepFoot = String(firstStepFoot || "").trim();

          if (this.firstStepFoot.includes("左")) {
            this.trajectoryJointIndex = 14;
          } else if (this.firstStepFoot.includes("右")) {
            this.trajectoryJointIndex = 8;
          } else {
            this.trajectoryJointIndex = null;
          }

          this.footTrajectoryEnabled = false;

          this.updateTrajectoryButton();

          this.fps = Number(fps) > 0 ? Number(fps) : 30;

          this.frames = this.convertRowsToFrames(rows || []);

          this.centerOfMassPoints = (centerOfMassPoints || []).map((point) => {
            if (!point) {
              return null;
            }

            const x = this.toNumber(point.x);
            const y = this.toNumber(point.y);

            return x === null || y === null ? null : { x: x, y: y };
          });

          if (this.frames.length === 0) {
            throw new Error("表示できる座標データがありません");
          }

          this.frameIndex = 0;

          this.calculateFit();

          this.draw();
        }

        setGraphOverlay(options) {
          this.graphOverlayVisible = Boolean(options?.visible);
          this.graphOverlayName = String(options?.graphName || "centerOfMass");
          this.graphOverlayPart = String(options?.partName || "rightElbow");
          this.draw();
        }

        toggleFootTrajectory() {
          if (this.trajectoryJointIndex === null) {
            return;
          }

          this.footTrajectoryEnabled = !this.footTrajectoryEnabled;

          this.updateTrajectoryButton();

          this.draw();
        }

        updateTrajectoryButton() {
          if (!this.trajectoryButton) {
            return;
          }

          const hasFootData = this.trajectoryJointIndex !== null;

          this.trajectoryButton.disabled = !hasFootData;
          this.trajectoryButton.classList.toggle(
            "is-active",
            hasFootData && this.footTrajectoryEnabled,
          );
          this.trajectoryButton.setAttribute(
            "aria-pressed",
            String(hasFootData && this.footTrajectoryEnabled),
          );
          this.trajectoryButton.textContent = hasFootData
            ? "足の軌道：" + (this.footTrajectoryEnabled ? "ON" : "OFF")
            : "足の軌道：データなし";
        }

        drawFootTrajectory() {
          if (
            !this.footTrajectoryEnabled ||
            this.trajectoryJointIndex === null
          ) {
            return;
          }

          const context = this.context;
          let pathStarted = false;

          context.save();
          context.lineWidth = 2;
          context.lineCap = "round";
          context.lineJoin = "round";
          context.strokeStyle = this.trajectoryJointIndex === 8
            ? "rgba(21, 101, 192, 0.28)"
            : "rgba(229, 57, 53, 0.28)";
          context.beginPath();

          for (const trajectoryFrame of this.frames) {
            const toePoint = trajectoryFrame[this.trajectoryJointIndex];

            if (!toePoint) {
              pathStarted = false;
              continue;
            }

            const position = this.toCanvas(toePoint);

            if (!pathStarted) {
              context.moveTo(position.x, position.y);
              pathStarted = true;
            } else {
              context.lineTo(position.x, position.y);
            }
          }

          context.stroke();
          context.restore();
        }

        // =====================
        // 46列の座標を23点へ変換
        // =====================
        convertRowsToFrames(rows) {
          const frames = [];

          for (const row of rows) {
            if (!Array.isArray(row) || row.length < 46) {
              continue;
            }

            /*
             * B:AUだけを取得しているため、
             * 元のExcelコードから列番号を
             * 1つずらしている
             *
             * 右大転子
             * x = 26
             * y = 27
             *
             * 左大転子
             * x = 38
             * y = 39
             */
            const rightHipX = this.toNumber(row[26]);

            const rightHipY = this.toNumber(row[27]);

            const leftHipX = this.toNumber(row[38]);

            const leftHipY = this.toNumber(row[39]);

            let centerX = 0;
            let centerY = 0;

            if (rightHipX !== null && leftHipX !== null) {
              centerX = (rightHipX + leftHipX) / 2;
            }

            if (rightHipY !== null && leftHipY !== null) {
              centerY = (rightHipY + leftHipY) / 2;
            }

            const joints = [];

            /*
             * 2列で1点
             * x、yを23点分読み込む
             */
            for (let column = 0; column < 46; column += 2) {
              const x = this.toNumber(row[column]);

              const y = this.toNumber(row[column + 1]);

              if (x === null || y === null) {
                joints.push(null);
              } else {
                joints.push({
                  x: x - centerX,
                  y: y - centerY,
                });
              }
            }

            if (joints.some((point) => point !== null)) {
              frames.push(joints);
            }
          }

          return frames;
        }

        // =====================
        // 数値変換
        // =====================
        toNumber(value) {
          if (value === null || value === "" || value === undefined) {
            return null;
          }

          const number = Number(value);

          return Number.isFinite(number) ? number : null;
        }

        // =====================
        // 全フレームに合う表示倍率
        // =====================
        calculateFit() {
          let minX = Infinity;
          let maxX = -Infinity;

          let minY = Infinity;
          let maxY = -Infinity;

          for (const frame of this.frames) {
            for (const point of frame) {
              if (!point) {
                continue;
              }

              minX = Math.min(minX, point.x);

              maxX = Math.max(maxX, point.x);

              minY = Math.min(minY, point.y);

              maxY = Math.max(maxY, point.y);
            }
          }

          if (
            !Number.isFinite(minX) ||
            !Number.isFinite(maxX) ||
            !Number.isFinite(minY) ||
            !Number.isFinite(maxY)
          ) {
            this.fitScale = 100;
            this.centerX = 0;
            this.centerY = 0;

            return;
          }

          const width = Math.max(maxX - minX, 0.01);

          const height = Math.max(maxY - minY, 0.01);

          const horizontalScale = (this.canvas.width - 70) / width;

          const verticalScale = (this.canvas.height - 70) / height;

          this.fitScale = Math.min(horizontalScale, verticalScale);

          this.centerX = (minX + maxX) / 2;

          this.centerY = (minY + maxY) / 2;
        }

        // =====================
        // 表示倍率変更
        // =====================
        setZoom(percent) {
          const value = Number(percent);

          if (!Number.isFinite(value)) {
            return;
          }

          this.zoom = Math.max(0.5, Math.min(value / 100, 2));

          this.draw();
        }

        // =====================
        // 再生速度変更
        // =====================
        setPlaySpeed(speed) {
          const allowedSpeeds = [0.25, 0.5, 1, 2, 4];

          const number = Number(speed);

          if (!allowedSpeeds.includes(number)) {
            return;
          }

          this.playSpeed = number;

          /*
           * 再生中に速度を変えた際の
           * 急なフレーム飛びを防止
           */
          if (this.isPlaying) {
            this.lastTime = performance.now();

            this.accumulatedTime = 0;
          }
        }

        // =====================
        // Canvas座標へ変換
        // =====================
        toCanvas(point) {
          const scale = this.fitScale * this.zoom;

          return {
            x: this.canvas.width / 2 + (point.x - this.centerX) * scale,

            y: this.canvas.height / 2 - (point.y - this.centerY) * scale,
          };
        }

        // =====================
        // 描画
        // =====================
        draw() {
          const context = this.context;

          context.fillStyle = "#ffffff";

          context.fillRect(0, 0, this.canvas.width, this.canvas.height);

          const frame = this.frames[this.frameIndex];

          if (!frame) {
            return;
          }

          /*
           * 1歩目の足のつま先軌道を
           * 全フレーム分、骨格の背面に表示
           */
          this.drawFootTrajectory();

          /*
           * 骨格線
           */
          context.lineWidth = 3;

          context.lineCap = "round";

          context.lineJoin = "round";

          for (const bone of STICK_BONES) {
            const firstPoint = frame[bone[0]];

            const secondPoint = frame[bone[1]];

            if (!firstPoint || !secondPoint) {
              continue;
            }

            const start = this.toCanvas(firstPoint);

            const end = this.toCanvas(secondPoint);

            context.strokeStyle = this.getBoneColor(bone);

            context.beginPath();

            context.moveTo(start.x, start.y);

            context.lineTo(end.x, end.y);

            context.stroke();
          }

          this.drawGraphOverlay(frame);

          /*
           * 関節点
           */
          frame.forEach((point, jointIndex) => {
            if (!point) {
              return;
            }

            const position = this.toCanvas(point);

            context.beginPath();

            context.arc(position.x, position.y, 4, 0, Math.PI * 2);

            context.fillStyle = this.getJointColor(jointIndex);
            context.fill();

            context.lineWidth = 1;
            context.strokeStyle = "rgba(255, 255, 255, 0.9)";
            context.stroke();
          });

          this.drawInformationOverlay();

          if (typeof this.onFrameChange === "function") {
            this.onFrameChange(this.frameIndex);
          }
        }

        getJointColor(jointIndex) {
          if (RIGHT_JOINTS.has(jointIndex)) {
            return STICK_COLORS.right;
          }

          if (LEFT_JOINTS.has(jointIndex)) {
            return STICK_COLORS.left;
          }

          return STICK_COLORS.center;
        }

        getBoneColor(bone) {
          const firstIndex = bone[0];
          const secondIndex = bone[1];

          if (RIGHT_JOINTS.has(firstIndex) && RIGHT_JOINTS.has(secondIndex)) {
            return STICK_COLORS.right;
          }

          if (LEFT_JOINTS.has(firstIndex) && LEFT_JOINTS.has(secondIndex)) {
            return STICK_COLORS.left;
          }

          return STICK_COLORS.center;
        }

        // =====================
        // グラフモード限定の補助表示
        // =====================
        drawGraphOverlay(frame) {
          if (!this.graphOverlayVisible) {
            return;
          }

          if (this.graphOverlayName === "centerOfMass") {
            this.drawCenterOfMassPoint();
            return;
          }

          if (
            this.graphOverlayName === "jointAngle" ||
            this.graphOverlayName === "jointAngularVelocity"
          ) {
            this.drawSelectedAngle(frame);
          }
        }

        drawCenterOfMassPoint() {
          const point = this.centerOfMassPoints[this.frameIndex];

          if (!point) {
            return;
          }

          const position = this.toCanvas(point);
          const context = this.context;

          context.save();
          context.beginPath();
          context.arc(position.x, position.y, 7, 0, Math.PI * 2);
          context.fillStyle = "#00a6d6";
          context.fill();
          context.lineWidth = 2;
          context.strokeStyle = "#ffffff";
          context.stroke();
          context.restore();
        }

        drawSelectedAngle(frame) {
          if (this.graphOverlayPart === "forwardLeanAngle") {
            this.drawForwardLeanAngle(frame);
            return;
          }

          const pointIndexes = JOINT_ANGLE_POINTS[this.graphOverlayPart];

          if (!pointIndexes) {
            return;
          }

          const first = frame[pointIndexes[0]];
          const vertex = frame[pointIndexes[1]];
          const second = frame[pointIndexes[2]];

          if (!first || !vertex || !second) {
            return;
          }

          const colors = this.getAngleColors(this.graphOverlayPart);

          this.drawAngleSector(
            this.toCanvas(first),
            this.toCanvas(vertex),
            this.toCanvas(second),
            colors,
          );
        }

        getAngleColors(partName) {
          if (String(partName).startsWith("right")) {
            return {
              fill: "rgba(21, 101, 192, 0.28)",
              stroke: STICK_COLORS.right,
            };
          }

          if (String(partName).startsWith("left")) {
            return {
              fill: "rgba(229, 57, 53, 0.28)",
              stroke: STICK_COLORS.left,
            };
          }

          return {
            fill: "rgba(255, 255, 255, 0.55)",
            stroke: STICK_COLORS.forwardLeanBorder,
          };
        }

        drawForwardLeanAngle(frame) {
          const rightHip = frame[13];
          const leftHip = frame[19];
          const headTop = frame[20];

          if (!rightHip || !leftHip || !headTop) {
            return;
          }

          const hipCenter = {
            x: (rightHip.x + leftHip.x) / 2,
            y: (rightHip.y + leftHip.y) / 2,
          };

          /*
           * 動作方向は基礎情報B9だけで決める。
           * 各フレームの座標値では切り替えないため、
           * 再生途中で基準方向が反転しない。
           */
          const movesLeft = this.movementDirection.includes("左");
          const horizontalPoint = {
            x: hipCenter.x + (movesLeft ? -1 : 1),
            y: hipCenter.y,
          };

          const canvasHipCenter = this.toCanvas(hipCenter);
          const canvasHorizontalPoint = this.toCanvas(horizontalPoint);
          const canvasHeadTop = this.toCanvas(headTop);
          const context = this.context;

          context.save();

          // 地面と平行な補助線
          context.beginPath();
          context.moveTo(canvasHipCenter.x - 120, canvasHipCenter.y);
          context.lineTo(canvasHipCenter.x + 120, canvasHipCenter.y);
          context.strokeStyle = "rgba(38, 50, 56, 0.28)";
          context.lineWidth = 1.5;
          context.setLineDash([5, 4]);
          context.stroke();

          // 左右大転子中点から頭頂までの補助線
          context.beginPath();
          context.moveTo(canvasHipCenter.x, canvasHipCenter.y);
          context.lineTo(canvasHeadTop.x, canvasHeadTop.y);
          context.strokeStyle = "rgba(38, 50, 56, 0.35)";
          context.lineWidth = 1.5;
          context.setLineDash([]);
          context.stroke();

          context.restore();

          this.drawAngleSector(
            canvasHorizontalPoint,
            canvasHipCenter,
            canvasHeadTop,
            this.getAngleColors("forwardLeanAngle"),
          );
        }

        drawAngleSector(first, vertex, second, colors) {
          const context = this.context;
          const firstAngle = Math.atan2(first.y - vertex.y, first.x - vertex.x);
          const secondAngle = Math.atan2(
            second.y - vertex.y,
            second.x - vertex.x,
          );
          let angleDifference = secondAngle - firstAngle;

          while (angleDifference > Math.PI) {
            angleDifference -= Math.PI * 2;
          }

          while (angleDifference < -Math.PI) {
            angleDifference += Math.PI * 2;
          }

          const radius = 30;
          const anticlockwise = angleDifference < 0;

          context.save();
          context.beginPath();
          context.moveTo(vertex.x, vertex.y);
          context.arc(
            vertex.x,
            vertex.y,
            radius,
            firstAngle,
            firstAngle + angleDifference,
            anticlockwise,
          );
          context.closePath();
          context.fillStyle = colors?.fill || "rgba(38, 50, 56, 0.2)";
          context.fill();
          context.lineWidth = 2;
          context.strokeStyle = colors?.stroke || STICK_COLORS.center;
          context.stroke();
          context.restore();
        }

        // =====================
        // 会員名・フレーム・時間表示
        // =====================
        drawInformationOverlay() {
          const context = this.context;
          const seconds = this.frameIndex / this.fps;
          const right = this.canvas.width - 14;
          const top = 14;
          const padding = 12;
          const lineHeight = 23;
          const lines = [
            this.memberName,
            "Frame " + (this.frameIndex + 1) + " / " + this.frames.length,
            "Time " + seconds.toFixed(2) + "秒",
          ];

          context.save();

          context.font = "bold 20px sans-serif";

          const textWidth = Math.max(
            ...lines.map((line) => context.measureText(line).width),
          );

          const boxWidth = textWidth + padding * 2;
          const boxHeight = lineHeight * lines.length + padding;
          const boxLeft = right - boxWidth + padding;

          context.fillStyle = "rgba(255, 255, 255, 0.72)";
          context.fillRect(boxLeft, top, boxWidth, boxHeight);

          context.fillStyle = "#27312e";
          context.textAlign = "right";
          context.textBaseline = "top";

          lines.forEach((line, index) => {
            context.font =
              index === 0 ? "bold 20px sans-serif" : "17px sans-serif";

            context.fillText(line, right, top + 7 + index * lineHeight);
          });

          context.restore();
        }

        // =====================
        // 再生
        // =====================
        play() {
          if (this.frames.length === 0 || this.isPlaying) {
            return;
          }

          /*
           * 最終フレームから再生した場合は
           * 最初に戻す
           */
          if (this.frameIndex >= this.frames.length - 1) {
            this.frameIndex = 0;
            this.draw();
          }

          this.isPlaying = true;

          this.lastTime = performance.now();

          this.accumulatedTime = 0;

          this.updatePlayButton();

          this.animationId = requestAnimationFrame((time) =>
            this.playLoop(time),
          );
        }

        // =====================
        // FPSに合わせた再生
        // =====================
        playLoop(currentTime) {
          if (!this.isPlaying) {
            return;
          }

          const elapsed = currentTime - this.lastTime;

          this.lastTime = currentTime;

          this.accumulatedTime += elapsed;

          const frameInterval = 1000 / (this.fps * this.playSpeed);

          /*
           * 200fpsなど、画面更新速度より
           * fpsが高い場合は必要な数だけ
           * フレームを進める
           */
          const advanceCount = Math.floor(this.accumulatedTime / frameInterval);

          if (advanceCount > 0) {
            this.accumulatedTime -= advanceCount * frameInterval;

            this.frameIndex += advanceCount;

            if (this.frameIndex >= this.frames.length) {
              if (this.loopEnabled) {
                this.frameIndex = this.frameIndex % this.frames.length;

                this.draw();
              } else {
                this.frameIndex = this.frames.length - 1;

                this.stop();
                this.draw();

                return;
              }
            } else {
              this.draw();
            }
          }

          this.animationId = requestAnimationFrame((time) =>
            this.playLoop(time),
          );
        }

        // =====================
        // 一時停止
        // =====================
        stop() {
          this.isPlaying = false;

          if (this.animationId !== null) {
            cancelAnimationFrame(this.animationId);

            this.animationId = null;
          }

          this.updatePlayButton();
        }

        // =====================
        // 再生切替
        // =====================
        togglePlay() {
          if (this.isPlaying) {
            this.stop();
          } else {
            this.play();
          }
        }

        // =====================
        // ループ再生切り替え
        // =====================
        toggleLoop() {
          this.loopEnabled = !this.loopEnabled;

          this.updateLoopButton();
        }

        // =====================
        // ループボタン表示更新
        // =====================
        updateLoopButton() {
          if (!this.loopButton) {
            return;
          }

          if (this.loopEnabled) {
            this.loopButton.textContent = "ループ再生：ON";

            this.loopButton.classList.add("is-active");

            this.loopButton.setAttribute("aria-pressed", "true");
          } else {
            this.loopButton.textContent = "ループ再生：OFF";

            this.loopButton.classList.remove("is-active");

            this.loopButton.setAttribute("aria-pressed", "false");
          }
        }

        // =====================
        // 1コマ進む
        // =====================
        nextFrame() {
          if (this.frames.length === 0) {
            return;
          }

          this.stop();

          this.frameIndex = (this.frameIndex + 1) % this.frames.length;

          this.draw();
        }

        // =====================
        // 1コマ戻る
        // =====================
        previousFrame() {
          if (this.frames.length === 0) {
            return;
          }

          this.stop();

          this.frameIndex =
            (this.frameIndex - 1 + this.frames.length) % this.frames.length;

          this.draw();
        }

        // =====================
        // ボタン表示更新
        // =====================
        updatePlayButton() {
          if (!this.playButton) {
            return;
          }

          this.playButton.textContent = this.isPlaying ? "一時停止" : "再生";
        }

        // =====================
        // ビューア終了
        // =====================
        destroy() {
          this.stop();

          this.frames = [];
        }
      }

      // =======================
      // 分析結果一覧の再読み込み
      // =======================
      async function reloadAnalysisList() {
        CACHE.analysisMembers = null;
        CACHE.analysisError = null;

        await loadHome();
      }

      // =======================
      // スケジュール取得
      // =======================
      async function loadSchedule() {
        if (CACHE.schedules) {
          return;
        }

        const data = await apiGet("getScheduleByLineId", {
          lineUserId: CACHE.profile.userId,
        });

        CACHE.schedules = data.schedules || [];
      }

      // =======================
      // カレンダー表示
      // =======================
      async function showSchedule() {
        lockUI("スケジュールを取得中...");

        try {
          await loadSchedule();

          renderSchedule();
        } catch (error) {
          alert(error.message);
        } finally {
          unlockUI();
        }
      }

      function renderSchedule() {
        const year = currentCalendarDate.getFullYear();

        const month = currentCalendarDate.getMonth();

        const startWeek = new Date(year, month, 1).getDay();

        const totalDays = new Date(year, month + 1, 0).getDate();

        let cells = "<tr>";
        let cellCount = 0;

        for (let i = 0; i < startWeek; i++, cellCount++) {
          cells += "<td></td>";
        }

        for (let day = 1; day <= totalDays; day++, cellCount++) {
          const date =
            `${year}/` +
            `${String(month + 1).padStart(2, "0")}/` +
            `${String(day).padStart(2, "0")}`;

          const schedules = CACHE.schedules.filter(
            (item) => item.date === date,
          );

          const mark = schedules.length ? scheduleMark(schedules[0].type) : "";

          const className = schedules.length ? "has-schedule" : "";

          const click = schedules.length
            ? `onclick="showScheduleDetail('${date}')"`
            : "";

          cells += `
      <td
        class="${className}"
        ${click}
      >
        ${day}<br>
        ${mark}
      </td>
    `;

          if ((cellCount + 1) % 7 === 0 && day !== totalDays) {
            cells += "</tr><tr>";
          }
        }

        while (cellCount % 7 !== 0) {
          cells += "<td></td>";
          cellCount++;
        }

        cells += "</tr>";

        document.getElementById("status").innerHTML = `
    <section class="card">

      <div class="calendar-head">

        <button onclick="changeMonth(-1)">
          ◀
        </button>

        <h2>
          ${year}年${month + 1}月
        </h2>

        <button onclick="changeMonth(1)">
          ▶
        </button>

      </div>

      <table>

        <thead>
          <tr>
            <th>日</th>
            <th>月</th>
            <th>火</th>
            <th>水</th>
            <th>木</th>
            <th>金</th>
            <th>土</th>
          </tr>
        </thead>

        <tbody>
          ${cells}
        </tbody>

      </table>

      <p class="muted">
        ● 通常　
        ★ 振替可　
        ▲ 雨天　
        ■ 休講
      </p>

      <button
        class="secondary"
        onclick="renderHome()"
      >
        ホームへ戻る
      </button>

    </section>
  `;
      }

      // =======================
      // スケジュール記号
      // =======================
      function scheduleMark(type) {
        return (
          {
            通常: "●",
            振替可: "★",
            雨天: "▲",
            休講: "■",
          }[type] || "●"
        );
      }

      // =======================
      // スケジュール詳細
      // =======================
      function showScheduleDetail(date) {
        const schedules = CACHE.schedules.filter((item) => item.date === date);

        if (!schedules.length) {
          return;
        }

        const details = schedules
          .map(
            (item) => `
        <hr>

        <p>
          <strong>
            ${escapeHtml(item.className)}
          </strong>
        </p>

        <p>
          ${escapeHtml(item.startTime)}
          ～
          ${escapeHtml(item.endTime)}
        </p>

        <p>
          ${escapeHtml(item.place)}
        </p>

        <p>
          ${escapeHtml(item.type)}
        </p>
      `,
          )
          .join("");

        document.getElementById("scheduleModalContent").innerHTML = `
      <h3>${escapeHtml(date)}</h3>

      ${details}

      <button
        class="secondary"
        onclick="closeScheduleModal()"
      >
        閉じる
      </button>
    `;

        document.getElementById("scheduleModal").style.display = "block";
      }

      // =======================
      // モーダルを閉じる
      // =======================
      function closeScheduleModal(event) {
        if (event && event.target.id !== "scheduleModal") {
          return;
        }

        document.getElementById("scheduleModal").style.display = "none";
      }

      // =======================
      // 前月・翌月
      // =======================
      function changeMonth(amount) {
        currentCalendarDate = new Date(
          currentCalendarDate.getFullYear(),
          currentCalendarDate.getMonth() + amount,
          1,
        );

        renderSchedule();
      }

      // =======================
      // 起動
      // =======================
      main();
    </script>
  </body>
</html>
